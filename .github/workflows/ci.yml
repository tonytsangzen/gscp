name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 桌面三端：测试 + 打包 ──
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (test + app/dmg)
            bundles: "app dmg"
          - os: ubuntu-latest
            name: Linux (test + deb/AppImage)
            bundles: "deb appimage"
          - os: windows-latest
            name: Windows (test + NSIS)
            bundles: "nsis"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 ffmpeg（供解码集成测试生成真实码流）
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: 安装 ffmpeg + Linux 系统依赖（WebKitGTK 等）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev \
            build-essential curl wget file patchelf

      - name: 安装 ffmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: 测试（62 项：协议/配置单测 + VideoToolbox/OpenH264 真实码流 + mock scrcpy 会话）
        run: cargo test --workspace

      - name: Tauri 打包（${{ matrix.bundles }}）
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: 压缩 .app（保留可执行位，统一命名 gscp_<版本>_aarch64.app.zip）
        if: runner.os == 'macOS'
        run: |
          cd target/release/bundle/macos
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_WORKSPACE/Cargo.toml" | head -n1)
          ditto -c -k --keepParent gscp.app "gscp_${VERSION}_aarch64.app.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: gscp-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.zip
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe

  # ── Android：arm64 APK ──
  android:
    name: Android (arm64 APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      CC_aarch64_linux_android: aarch64-linux-android24-clang
      AR_aarch64_linux_android: llvm-ar
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17（Gradle 缓存随附）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Rust (stable) + Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2

      - name: 解析 NDK 并注入构建环境
        run: |
          set -euo pipefail
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n1)"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "NDK_HOME=$NDK"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "NDK: $NDK"

      - name: 拉取 ncnn 源码（vendored 目录被 gitignore，锁定提交 + glslang submodule）
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Tencent/ncnn tools/ncnn/src
          git -C tools/ncnn/src fetch --depth 1 origin 6c52e59dfb610cbd77946bea19099aaf96f8dcc1
          git -C tools/ncnn/src checkout 6c52e59dfb610cbd77946bea19099aaf96f8dcc1
          git -C tools/ncnn/src submodule update --init --depth 1 glslang

      - name: 构建 ncnn（arm64-v8a shared + Vulkan，与本地 tools/ncnn/build-android-arm64 同参）
        run: |
          set -euo pipefail
          sudo apt-get install -y libvulkan-dev
          cmake -S tools/ncnn/src -B tools/ncnn/build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DNCNN_SHARED_LIB=ON -DNCNN_VULKAN=ON -DNCNN_OPENMP=OFF \
            -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF
          cmake --build tools/ncnn/build-android-arm64 --parallel

      - name: 预构建 Rust 库（解包 registry 源码并预热编译）
        run: cargo build --release --package gscp-app --lib --target aarch64-linux-android

      - name: 构建 ncnnshim（ar_face_live.cpp → jniLibs/arm64-v8a）
        run: ./tools/ncnn/build-shim.sh

      # jniLibs/**/*.so 被 gitignore：本地图 Rust 库靠 symlink、libc++_shared 靠手工放入，
      # CI 没有这些产物，缺了就是残缺 APK（libgscp_app_lib.so 不打包 / AR 进屏即闪退）。
      - name: 备齐 jniLibs（Rust 库 + libc++_shared）
        run: |
          set -euo pipefail
          LIBS=crates/gscp-app/gen/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$LIBS"
          cp target/aarch64-linux-android/release/libgscp_app_lib.so "$LIBS/"
          cp "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$LIBS/"
          ls -l "$LIBS"

      - name: 生成 tauri.settings.gradle（BuildTask 直调 cargo，需自行生成）
        run: ./scripts/gen-tauri-settings.sh

      - name: 构建 APK（arm64 release，正式签名，缺 keys/ 时回退 debug 签名）
        working-directory: crates/gscp-app/gen/android
        run: |
          chmod +x gradlew
          ./gradlew assembleArm64Release

      - name: 验证 APK 为 release 正式签名
        run: |
          set -euo pipefail
          APK=$(ls crates/gscp-app/gen/android/app/build/outputs/apk/arm64/release/*.apk | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify "$APK"
          echo "已验证 release 签名: $APK"

      # 2026-10-14 教训：CI 出过只有 libconscrypt_jni.so 的残缺包（缺 libncnnshim.so
      # 进 AR 即 UnsatisfiedLinkError 闪退、缺 libgscp_app_lib.so、版本号回落 1.0），
      # 此校验让任何一步遗漏在 CI 直接红，而不是装到真机上才发现。
      - name: 验证 APK 完整性（native 库清单 + 版本号）
        run: |
          set -euo pipefail
          APK=$(ls crates/gscp-app/gen/android/app/build/outputs/apk/arm64/release/*.apk | head -n1)
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          for lib in libgscp_app_lib.so libncnn.so libncnnshim.so libc++_shared.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib" \
              || { echo "::error::APK 缺少 lib/arm64-v8a/${lib}（检查 ncnn/shim/jniLibs 构建步骤）"; exit 1; }
          done
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          "$AAPT2" dump badging "$APK" | grep -o "versionName='[^']*' versionCode='[^']*'" | head -n1
          "$AAPT2" dump badging "$APK" | grep -q "versionName='$VERSION'" \
            || { echo "::error::versionName 不是 ${VERSION}（tauri.properties 未生成？）"; exit 1; }
          echo "✓ APK 完整性校验通过: $APK"

      - name: 统一 APK 命名（gscp_<版本>_aarch64.apk）
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          cd crates/gscp-app/gen/android/app/build/outputs/apk/arm64/release
          mv app-arm64-release.apk "gscp_${VERSION}_aarch64.apk"
          ls -l

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: gscp-android-arm64
          if-no-files-found: error
          path: crates/gscp-app/gen/android/app/build/outputs/apk/arm64/release/gscp_*.apk

  # ── iOS：协议自检 + 模拟器 App 包 ──
  ios:
    name: iOS (selftest + simulator app)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 选择最新 Xcode（App 工程为 Xcode 16+ 同步分组格式）
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)/Contents/Developer"
          xcodebuild -version

      - name: 协议自检（adb/scrcpy 帧格式、密钥解析、AUTH 签名、OpusHead/libopus）
        working-directory: ios
        run: |
          swift build
          swift run gscp-selftest

      - name: 安装 xcodegen（工程构建失败时的回退生成器）
        run: brew install xcodegen

      - name: 构建模拟器 App（已提交工程）
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project GSCP.xcodeproj -target GSCP -configuration Release \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build 2>&1 | tee build.log \
            || { grep -E "error:" build.log | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }

      - name: 回退：xcodegen 重新生成后构建（仅当上一步失败）
        if: failure()
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project GSCP.xcodeproj -target GSCP -configuration Release \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build2" build 2>&1 | tee build2.log \
            || { grep -E "error:" build2.log | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }

      - name: 统一命名并打包（gscp_<版本>_ios_simulator.app.zip）
        working-directory: ios/App
        run: |
          set -euo pipefail
          APP=$(ls -d build*/Release-iphonesimulator/GSCP.app | head -n1)
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_WORKSPACE/Cargo.toml" | head -n1)
          ditto -c -k --keepParent "$APP" "gscp_${VERSION}_ios_simulator.app.zip"
          ls -lh "gscp_${VERSION}_ios_simulator.app.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: gscp-ios-simulator
          if-no-files-found: error
          path: ios/App/gscp_*_ios_simulator.app.zip

  # ── 发布：tag 推送时自动创建 Release 并绑定各平台产物与文档 ──
  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 汇集全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 附带使用说明文档（统一命名 gscp_<版本>_使用说明.pdf）
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          cp "docs/GSCP使用说明.pdf" "dist/gscp_${VERSION}_使用说明.pdf"
          ls -lh dist/

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
