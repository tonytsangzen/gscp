# XcodeGen 工程规格：brew install xcodegen && ./gen-project.sh
# 生成的 GSCP.xcodeproj 引用上一层目录的 SPM 包（GSCPKit）。
name: GSCP
options:
  bundleIdPrefix: com.gscp
  deploymentTarget:
    iOS: "17.0"
packages:
  GSCPKit:
    path: ..
targets:
  GSCP:
    type: application
    platform: iOS
    sources:
      - path: GSCP
    dependencies:
      - package: GSCPKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gscp.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "AR 模式用手机摄像头追踪人脸，把眼镜 overlay 画在人脸正前方"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "录像时收录手机声音"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
